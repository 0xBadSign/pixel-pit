[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "./script" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[lint]
# every narrowing cast in PixelPit is bounded by CAP (40) or by an explicit range check first
exclude_lints = ["unsafe-typecast", "require-revert-in-loop"]
